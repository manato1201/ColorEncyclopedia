.0">WCAG コントラスト比</text><text class="title" x="590" y="462.0">spaced-repetition.ts</text><text class="sub mono" x="590" y="481.0">ライトナー式の箱</text><text class="sub mono" x="590" y="496.0">(1・3・7・14・30 日)</text><text class="title" x="590" y="642.0">shape-visualizers・geometry3d</text><text class="sub mono" x="590" y="661.0">作図フレーム・3D の幾何</text><text class="sub mono" x="590" y="676.0">(three.js に依存しない)</text><text class="title" x="1020" y="282.0">createContentLoader</text><text class="sub mono" x="1020" y="301.0">Markdown → メタ・本文 HTML</text><text class="sub mono" x="1020" y="316.0">(gray-matter・marked)</text><text class="title" x="1020" y="462.0">ページ</text><text class="sub mono" x="1020" y="481.0">/colors・/shapes・/atlas</text><text class="sub mono" x="1020" y="496.0">/compare・/exam・/basics</text><text class="title" x="1020" y="642.0">可視化</text><text class="sub mono" x="1020" y="661.0">2D(canvas)・3D(three.js)</text><text class="sub mono" x="1020" y="676.0">「立体」を選んだ時に読み込む</text><text class="title" x="1390" y="332.0">localStorage</text><text class="sub mono" x="1390" y="351.0">学習履歴</text><text class="sub mono" x="1390" y="366.0">ce:review:v1</text><text class="title" x="1390" y="552.0">verify-content.mjs</text><text class="sub mono" x="1390" y="571.0">frontmatter・問題・可視化を検査</text><text class="sub mono" x="1390" y="586.0">(npm run verify)</text><rect class="lab" x="542.8" y="129.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="560.0" y="141.0">読む</text><rect class="lab" x="792.8" y="304.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="810.0" y="316.0">計算</text><rect class="lab" x="1194.4" y="334.0" width="71.2" height="16" rx="3"/><text class="alabel mono " x="1230.0" y="346.0">解答を保存</text><rect class="lab" x="792.8" y="543.0" width="34.5" height="16" rx="3"/><text class="alabel mono " x="810.0" y="555.0">検査</text><text class="hd" x="40" y="44" text-anchor="start">ColorEncyclopedia — 構成</text><text class="note" x="40" y="66" text-ancho